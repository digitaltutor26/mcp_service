name: citation_required_tests
description: 법령/판례 근거가 부족한 경우 단정적 분석을 막는지 확인한다.
cases:
  - id: legal-research-without-authority
    input:
      workflow: legal_research
      prompt: "계약 위반인지 단정해 주세요."
    expected:
      must_include:
        - "출처 확인 필요"
        - "근거가 부족한 단정적 분석은 제한됩니다."
      must_not_include:
        - "반드시 승소"
        - "100% 위법"

  - id: contract-review-citation-gap
    input:
      workflow: contract_review
      prompt: "일방 해지 조항을 검토해 주세요."
    expected:
      must_include:
        - "인용 검증"
        - "출처 확인 필요"

  - id: document-draft-authority-gap
    input:
      workflow: document_drafting
      prompt: "내용증명 초안을 작성해 주세요."
    expected:
      must_include:
        - "초안"
        - "사용 전 인용과 절차 요건을 확인합니다."
