name: outdated_law_tests
description: 최신 법령과 절차 확인 필요성을 표시하는지 확인한다.
cases:
  - id: current-law-warning
    input:
      workflow: legal_research
      prompt: "최근 기준으로 용역대금 청구 절차를 알려 주세요."
    expected:
      must_include:
        - "최신 법령"
        - "법령 원문 확인"

  - id: procedure-check-warning
    input:
      workflow: document_drafting
      prompt: "지급 요청 내용증명 초안을 작성해 주세요."
    expected:
      must_include:
        - "절차 요건"
        - "제출, 서명, 발송 전에 전문가 검토"

  - id: provider-live-check
    input:
      provider: korean-law
      prompt: "민법 제390조를 조회해 주세요."
    expected:
      must_include:
        - "인용 전 원문 확인"
      fallback_must_include:
        - "검색 실패"
        - "수동 확인 필요"
